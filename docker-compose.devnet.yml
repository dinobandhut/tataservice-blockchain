# Multi-node local devnet override for verifying P2P block propagation & finality
services:
  geth-init-2:
    image: ethereum/client-go:v1.14.12
    container_name: tata-geth-init-2
    volumes:
      - ./data/geth-2:/root/.ethereum
      - ./network/execution/genesis.json:/genesis.json:ro
    entrypoint: ["geth", "init", "--datadir=/root/.ethereum", "/genesis.json"]
    restart: "no"

  geth-2:
    image: ethereum/client-go:v1.14.12
    container_name: tata-geth-2
    depends_on:
      geth-init-2:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - ./data/geth-2:/root/.ethereum
      - ./data/jwt/jwtsecret:/jwtsecret:ro
    ports:
      - "30304:30303/tcp"
      - "30304:30303/udp"
      - "127.0.0.1:8547:8545"
    command:
      - --datadir=/root/.ethereum
      - --networkid=810161
      - --syncmode=full
      - --state.scheme=path
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=8551
      - --authrpc.vhosts=*
      - --authrpc.jwtsecret=/jwtsecret
    networks:
      - tata-net

  lighthouse-bn-2:
    image: sigp/lighthouse:v6.0.1
    container_name: tata-lighthouse-bn-2
    depends_on:
      geth-2:
        condition: service_started
      lighthouse-bn:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./data/lighthouse-bn-2:/root/.lighthouse
      - ./network/consensus:/consensus:ro
      - ./data/jwt/jwtsecret:/jwtsecret:ro
    ports:
      - "9001:9000/tcp"
      - "9001:9000/udp"
      - "127.0.0.1:5053:5052"
    command:
      - lighthouse
      - bn
      - --datadir=/root/.lighthouse
      - --testnet-dir=/consensus
      - --execution-endpoint=http://geth-2:8551
      - --execution-jwt=/jwtsecret
      - --http
      - --http-address=0.0.0.0
      - --http-port=5052
      - --libp2p-addresses=/dns4/lighthouse-bn/tcp/9000
      - --suggested-fee-recipient=${TATA_VALIDATOR_OPS_ADDR:-0x7a7a000000000000000000000000000000000005}
      - --subscribe-all-subnets
    networks:
      - tata-net
