[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
tata_local = "http://127.0.0.1:8545"
tata_public = "${PUBLIC_RPC_URL}"
