# TataService Blockchain — Hardened Nginx Reverse Proxy
# Terminates HTTP/HTTPS, enforces rate limits, blocks direct internal ports,
# routes /rpc & /api/ to hardened Node.js gateway, and serves Tata Explorer SPA.

limit_req_zone $binary_remote_addr zone=tata_rpc_limit:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=tata_api_limit:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # Public Hardened JSON-RPC Endpoint
    location = /rpc {
        limit_req zone=tata_rpc_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:4000/rpc;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Public WebSocket RPC Endpoint (eth,net,web3 only)
    location = /ws {
        limit_req zone=tata_rpc_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:8546;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Explorer REST API & Authenticated Admin API
    location /api/ {
        limit_req zone=tata_api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Block public access to Prometheus /metrics at edge
    location = /metrics {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:4000/metrics;
    }

    # Tata Explorer React Frontend
    root /opt/tataservice/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
